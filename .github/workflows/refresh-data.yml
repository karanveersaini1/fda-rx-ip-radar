name: Refresh site data

on:
  schedule:
    # 07:00 UTC daily — openFDA posts the prior day's actions overnight.
    - cron: "0 7 * * *"
  workflow_dispatch:

# Serialize runs so two refreshes never race on the same commit.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # ETL is stdlib-only, but needs 3.10+ for `X | None` annotations.
          python-version: "3.12"

      # Year-to-date, ending yesterday: openFDA has barely any of today's
      # actions at 07:00 UTC. Derived at runtime so this rolls over on Jan 1.
      - name: Build window
        id: window
        run: |
          end=$(date -u -d yesterday +%F)
          echo "start=${end%%-*}-01-01" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"

      - name: Run ETL
        env:
          START_DATE: ${{ steps.window.outputs.start }}
          END_DATE: ${{ steps.window.outputs.end }}
        run: python etl/run_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          # meta.json carries a generated_at stamp that changes on every run, so
          # the check above alone would commit daily even when FDA published
          # nothing. Treat a meta.json-only diff of just that line as no change.
          if [ "$(git diff --cached --name-only)" = "docs/data/meta.json" ] &&
             ! git diff --cached -U0 -- docs/data/meta.json |
                 grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' |
                 grep -qv generated_at; then
            echo "Only the generated_at timestamp moved; nothing to commit."
            git reset -q
            exit 0
          fi
          git commit -m "data: refresh through ${{ steps.window.outputs.end }}"
          git push

      # Recovery: a failing run opens an etl-failure issue but can't close it,
      # so a transient source outage (e.g. an openFDA 403) would otherwise leave
      # a stale "is failing" issue open long after the pipeline recovered. Close
      # any open one on success, which re-arms the alert for the next real break.
      - name: Clear failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/clear-failure-alert.sh

      # A scheduled job that breaks is otherwise only visible in an email, so
      # surface it as an issue. Comment on the existing open one rather than
      # filing a fresh issue every day the source stays broken.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today=$(date -u +%F)
          gh label create etl-failure --color B60205 \
            --description "Scheduled data refresh failed" 2>/dev/null || true
          existing=$(gh issue list --label etl-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Refresh failed again on $today. $RUN_URL"
            exit 0
          fi
          gh issue create --label etl-failure \
            --title "Scheduled data refresh is failing" \
            --body "$(cat <<EOF
          The daily ETL failed on $today.

          Run log: $RUN_URL

          The site keeps serving the last good docs/data/, so it is stale rather
          than broken. Closing this issue re-arms the alert.
          EOF
          )"
