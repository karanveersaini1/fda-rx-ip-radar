name: Refresh site data

on:
  schedule:
    # 07:00 UTC daily — openFDA posts the prior day's actions overnight.
    - cron: "0 7 * * *"
  workflow_dispatch:

# Serialize runs so two refreshes never race on the same commit.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ETL is stdlib-only, but needs 3.10+ for `X | None` annotations.
          python-version: "3.12"

      - name: Build window
        id: window
        run: |
          end=$(date -u -d 'yesterday' +%F)
          echo "start=$(date -u -d "$end" +%Y)-01-01" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"

      - name: Run ETL
        env:
          START_DATE: ${{ steps.window.outputs.start }}
          END_DATE: ${{ steps.window.outputs.end }}
        run: python etl/run_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git commit -m "data: refresh through ${{ steps.window.outputs.end }}"
          git push

      # A scheduled job that breaks is otherwise only visible in an email, so
      # surface it as an issue. Comment on the existing open one rather than
      # filing a fresh issue every day the source stays broken.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create etl-failure --color B60205 \
            --description "Scheduled data refresh failed" 2>/dev/null || true
          existing=$(gh issue list --label etl-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Refresh failed again on $(date -u +%F). $RUN_URL"
          else
            gh issue create --label etl-failure \
              --title "Scheduled data refresh is failing" \
              --body "The daily ETL failed on $(date -u +%F).

          Run log: $RUN_URL

          The site keeps serving the last good \`docs/data/\`, so it is stale rather
          than broken. Closing this issue re-arms the alert."
          fi
